<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1233">
<title>ShotPlan</title>
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon-plan.png?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-plan.png?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-plan-32.png">
<meta name="apple-mobile-web-app-title" content="ShotPlan">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--ink:#1b1233;--ink2:#251a45;--line:#3a2e63;--fg:#f4efff;--muted:#b7a9dc;--pink:#ff3d81;--yellow:#ffd23f;--ok:#3ddc97;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
body{padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:26px;font-weight:900;color:var(--pink)}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.cam{border:1px solid var(--line);background:var(--ink2);color:var(--fg);text-decoration:none;font-weight:800;font-size:13px;padding:9px 14px;border-radius:99px;white-space:nowrap}
.tabs,.shops{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs,.shops{flex-wrap:wrap;overflow:visible}
.tabs::-webkit-scrollbar,.shops::-webkit-scrollbar{display:none}
.tab,.shop{flex:0 0 auto;border:1px solid var(--line);background:var(--ink2);color:var(--fg);font:inherit;font-weight:800;font-size:14px;padding:9px 15px;border-radius:99px;cursor:pointer}
.shops{gap:6px}.shop{font-size:13px;padding:6px 11px}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.shop[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.reset{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:n}
.item{counter-increment:n;background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.item.done{opacity:.55}
.chk{width:26px;height:26px;margin-top:2px;accent-color:var(--ok);grid-row:span 3}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.top b{font-size:16px}
.top b::before{content:counter(n)". ";color:var(--muted);font-weight:700}
.badge{font-size:11px;font-weight:900;padding:2px 8px;border-radius:99px;background:var(--line)}
.badge.photo{background:#2b6cff33;color:#9ec0ff}.badge.video{background:#ff3d8133;color:#ff9cc0}
.badge.hero{background:var(--yellow);color:var(--ink)}
.tip{margin:0;font-size:14px;line-height:1.6;color:#e4dcf7}
.go{justify-self:start;margin-top:4px;text-decoration:none;font-weight:900;font-size:13px;color:var(--ink);background:var(--yellow);padding:7px 12px;border-radius:99px}
.caution{background:#2a1f12;border:1px solid #6b4f12;border-radius:16px;padding:12px 14px}
.caution summary{cursor:pointer;font-weight:900;color:var(--yellow);font-size:15px;list-style:none}
.caution summary::-webkit-details-marker{display:none}
.caution summary::after{content:" ▼";font-size:11px}
.caution[open] summary::after{content:" ▲"}
.caution ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;font-size:14px;line-height:1.6;color:#f3e6c4}
.badge.info{background:#3ddc9733;color:#8ff0c4}
.plan{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}
.plan h2{margin:0;font-size:16px}
.plan ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px;line-height:1.6}
.plan p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.manners{font-size:12px;color:var(--muted);line-height:1.7;margin:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>ShotPlan</h1><p class="sub">お店や場所に着いたら、撮るものを順番にチェック</p></div>
    <a class="cam" href="../">カメラを開く</a>
  </header>
  <div class="tabs" id="tabs" role="group" aria-label="分野"></div>
  <div class="shops" id="shops" role="group" aria-label="お店・場所"></div>
  <div class="prog"><span id="progText">0 / 0</span><div class="bar"><i id="progBar"></i></div><button class="reset" id="reset" type="button">チェックを外す</button></div>
  <details class="caution" id="caution"><summary id="cautionTitle">撮る前に確認</summary><ul id="cautionList"></ul></details>
  <ol class="list" id="list"></ol>
  <section class="plan" id="plan"></section>
</div>

  const hero=photos.find(x=>x[5])||photos[0],info=photos.filter(x=>x[6]&&x!==hero);
  const mid=photos.filter(x=>x!==hero&&!x[6]).slice(0,Math.max(0,7-1-info.length));const car=[hero,...mid,...info];
  const sec=videos.length?Math.max(2,Math.round(15/videos.length)):0;
  $('#plan').innerHTML=`<h2>投稿プラン</h2>
   <p><b>カルーセル(写真${car.length}枚)</b>:1枚目は一番目を引く写真、最後に保存したくなる情報を。</p>
   <ol>${car.map(x=>`<li>${esc(x[0])}</li>`).join('')}</ol>
   ${videos.length?`<p><b>リール(約15秒)</b>:冒頭1〜3秒で一番の見せ場を。1カット約${sec}秒。</p><ol>${videos.map(x=>`<li>${esc(x[0])}</li>`).join('')}</ol>`:''}
   <p>キャプションには店名・場所・おすすめを1行で。位置情報タグも忘れずに。</p>
   <p><b>投稿するとき</b></p><ol>${POSTING.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
  const cl=[...CAUTION_COMMON,...(CAUTION[cat]||[])];
  $('#cautionTitle').textContent=`撮る前に確認(${cl.length}項目)`;$('#cautionList').innerHTML=cl.map(x=>`<li>${esc(x)}</li>`).join('');
}
function persist(){st.cat=cat;st.shop=shop;save(st);}
$('#reset').onclick=()=>{const d=st.done||{};d[shop]=[];st.done=d;persist();render();};
render();
</script>
</body>
